d ambiguity still requires review.','Mehrdeutigkeit ist ein eigenes Label für fehlende Belege oder unklare Referenz und Haltung, kein Verstoß. Auch dieser Vorschlag muss geprüft werden.'],m5:['公开讨论，持续维护','Public discussion & stewardship','Öffentliche Diskussion & Pflege'],m5d:['已入库语料可点赞、留言、举报。管理员可依据举报下架或重开研判。编辑精选案例独立标识；社区标签是研究共识，不是 TikTok 官方裁决。','Published samples support likes, comments and reports. Moderators can hide samples or reopen review. Curated examples are marked separately; community labels are research consensus, not official TikTok decisions.','Freigegebene Belege können gelikt, kommentiert und gemeldet werden. Moderation kann ausblenden oder neu prüfen lassen. Redaktionelle Beispiele sind gekennzeichnet; Konsens ist kein offizielles TikTok-Urteil.'],

const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const readPref=(k,f)=>{try{return localStorage.getItem(k)||f}catch{return f}};
let lang=readPref('kl-language','zh'),theme=readPref('kl-theme','dark');if(!['zh','en','de'].includes(lang))lang='zh';if(!['dark','light'].includes(theme))theme='dark';
function t(k){return (DICT[k]||[k,k,k])[{zh:0,en:1,de:2}[lang]]}function tag(k){return t(k==='ambiguous'?'ambiguousTag':k)}
let db,user=null,profiles=[],samples=[],stats={samples:[],contributors:[]},myVotes=[],myLikes=[],loaded=false,query='',filter='',sort='newest',page=1,requestVersion=0,recovery=false;
const thresholds=[0,1,5,15,30,60];
function level(n){let stars=0;for(let i=1;i<thresholds.length;i++)if(n>=thresholds[i])stars=i;let start=thresholds[stars],end=thresholds[stars+1];return{stars,next:end??null,percent:end?Math.min(100,(n-start)/(end-start)*100):100}}
function route(){let r=(location.hash||'#library').slice(1).split('/')[0];return ['library','review','ambiguous','submit','profile','member','methods','lab','admin'].includes(r)?r:'library'}
function name(id){return profiles.find(p=>p.id===id)?.display_name||t('curator')}
function summary(id){return stats.samples.find(s=>s.id===id)||{votes:0,likes:0,comments:0,ballots:{}}}
function contribution(id){return stats.contributors.find(p=>p.id===id)||{submitted:0,accepted:0,reviews:0}}
function leading(s){let [key,n]=Object.entries(s.ballots||{}).filter(([k])=>k!=='reject').sort((a,b)=>b[1]-a[1])[0]||[null,0];return {key,n,ratio:s.votes?n/s.votes:0}}
function date(s){return new Date(s).toLocaleDateString({zh:'zh-CN',en:'en-GB',de:'de-DE'}[lang])}
function notify(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastId);window.toastId=setTimeout(()=>$('#toast').style.display='none',5000)}
function humanError(e){const raw=e?.message||String(e);const code=Object.keys(E).find(k=>raw.includes(k));if(code)return E[code][{zh:0,en:1,de:2}[lang]];if(/duplicate key/.test(raw))return {zh:'你已提交过该操作，请刷新查看。',en:'Already submitted. Refresh to view.',de:'Bereits gesendet. Zum Anzeigen aktualisieren.'}[lang];return raw}

function card(s){const a=summary(s.id),pending=s.status==='pending';return `<article class="corpus-card"><div class="card-top"><span class="badge ${pending?'pending':s.final_tag==='ambiguous'?'ambiguous':''}">${pending?t('unreviewed'):tag(s.final_tag)}</span><span class="pill-count">${s.language.toUpperCase()} · ${date(s.created_at)}</span></div><div class="sample-text" lang="${s.language}">${esc(s.text)}</div><div class="sample-context">${esc(s.context)}</div><div class="card-bottom"><span>${pending?`${a.votes} ${t('votes')}`:`♡ ${a.likes}　◌ ${a.comments}`}<br>${s.seed_code?t('seed'):pending?tag(s.proposed_tag):t('community')}</span><button class="card-open" data-sample="${s.id}">${t('read')}</button></div></article>`}

async function refresh(){const v=++requestVersion;const result=await Promise.all([db.from('kl_samples').select('*').order('created_at',{ascending:false}).limit(1000),db.from('kl_profiles').select('id,display_name,bio,created_at').limit(1000),db.rpc('kl_stats'),user?db.from('kl_votes').select('sample_id,tag,rationale').eq('user_id',user.id):Promise.resolve({data:[]}),user?db.from('kl_likes').select('sample_id').eq('user_id',user.id):Promise.resolve({data:[]})]);for(const r of result)if(r.error)throw r.error;if(v!==requestVersion)return;samples=result[0].data;profiles=result[1].data;stats=result[2].data;myVotes=result[3].data;myLikes=result[4].data;loaded=true;render()}

function renderLab(){$('#main').innerHTML=title('lab','policyNotice')+`<iframe class="lab-frame" title="KontextLab V1 annotation research lab" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe>`;if(window.KL_LEGACY)$('.lab-frame').srcdoc=new TextDecoder().decode(Uint8Array.from(atob(window.KL_LEGACY),c=>c.charCodeAt(0)));else $('.lab-frame').src='../kontextlab/index.html'}
async function renderAdmin(){$('#main').innerHTML=title('admin','adminOnly');if(!user)return;let {data,error}=await db.rpc('kl_admin_reports');if(error){$('#main').innerHTML+=`<p class="notice">${esc(humanError(error))}</p>`;return}$('#main').innerHTML+=`<div class="panel">${data.length?data.map(r=>`<article class="comment"><p>${esc(r.text)}</p><p class="muted">${esc(r.reason)}</p><p class="fine">${esc(r.status)} · ${date(r.created_at)}</p><div class="inline"><button data-admin="hide" data-id="${r.sample_id}">${t('hide')}</button><button data-admin="reopen" data-id="${r.sample_id}">${t('reopen')}</button></div></article>`).join(''):t('noReports')}</div>`;$$('[data-admin]').forEach(b=>b.onclick=()=>action(b,async()=>{let {error}=await db.rpc('kl_admin_action',{p_sample:b.dataset.id,p_action:b.dataset.admin});if(error)throw error;await refresh();notify(t('saved'))}))}
function authDialog(mode='login'){const d=openDialog(dialogTop(t('authTitle'))+`<div class="auth-tabs"><button id="auth-login" class="${mode==='login'?'selected':''}">${t('login')}</button><button id="auth-signup" class="${mode==='signup'?'selected':''}">${t('signup')}</button></div><form id="auth-form"><label class="field"><span>${t('email')}</span><input type="email" name="email" required autocomplete="email"></label><label class="field"><span>${t('password')}</span><input type="password" name="password" required minlength="8" autocomplete="${mode==='signup'?'new-password':'current-password'}"></label><p class="fine">${t('authNote')}</p><p id="auth-message" class="error-box" role="status"></p><button class="primary" type="submit">${t(mode)}</button></form>`);$('#auth-login').onclick=()=>authDialog('login');$('#auth-signup').onclick=()=>authDialog('signup');$('#auth-form').onsubmit=e=>{e.preventDefault();action($('button.primary',e.target),async()=>{let fd=new FormData(e.target);let options={email:fd.get('email').trim(),password:fd.get('password')};if(mode==='signup'){const response=await fetch(KL_CONFIG.url+'/functions/v1/kl-register',{method:'POST',headers:{'Content-Type':'application/json','apikey':KL_CONFIG.key},body:JSON.stringify(options)});const registration=await response.json();if(!response.ok)throw Error(registration.error||'registration_failed')}let result=await db.auth.signInWithPassword(options);if(result.error){$('#auth-message').textContent=humanError(result.error);return}user=result.data.user;d.close();await refresh();notify(t('saved'))})};$('#forgot')?.addEventListener('click',e=>action(e.target,async()=>{const email=$('#auth-form').elements.email.value.trim();if(!email||!email.includes('@'))throw Error(t('invalid'));const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://hallodongyue-lang.github.io/kontextlab/'});if(error)throw error;$('#auth-message').textContent=t('resetSent')}))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sample]');if(b)openSample(b.dataset.sample).catch(catchError)});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});window.addEventListener('hashchange',()=>{filter='';query='';page=1;$('#dialog').close();render();window.scrollTo(0,0)});
async function init(){renderShell();try{if(!window.supabase)throw Error('Supabase client failed to load');db=window.supabase.createClient(KL_CONFIG.url,KL_CONFIG.key);const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user||null;db.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(event==='PASSWORD_RECOVERY'){recovery=true;location.hash='profile'}if(event==='SIGNED_OUT'){myVotes=[];myLikes=[]}setTimeout(()=>refresh().catch(catchError),0)});await refresh()}catch(e){$('#main').innerHTML=`<div class="empty"><b>${t('connectionFail')}</b><p>${esc(humanError(e))}</p><button id="retry">${t('retry')}</button></div>`;$('#retry').onclick=()=>location.reload()}}
init();
</script></body></html>
