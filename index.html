const DICT={
 guide:['新手使用指南','Getting started','Erste Schritte'],guideIntro:['按 5 个步骤了解语料提交、独立研判与社区互动。可以随时离开，之后从问号按钮继续。','Learn submissions, independent review and community interaction in 5 steps. Leave at any time and resume with the question-mark button.','Lerne Einreichung, unabhängige Prüfung und Austausch in 5 Schritten kennen. Jederzeit verlassen und über das Fragezeichen fortsetzen.'],guideProgress:['学习进度','Guide progress','Fortschritt'],guideStart:['开始使用','Get started','Loslegen'],guideLater:['稍后再看','Remind me later','Später ansehen'],guideNext:['已了解，下一步','Understood, next step','Verstanden, weiter'],guideBack:['上一步','Previous step','Vorheriger Schritt'],guideFinish:['完成指南','Finish guide','Einführung abschließen'],guideDone:['已完成新手指南','Getting-started guide completed','Einführung abgeschlossen'],guideDoneText:['你可以随时回来复习。指南进度不计入贡献星级。','Return whenever you need a refresher. Guide progress does not earn contribution stars.','Du kannst jederzeit nachlesen. Die Einführung erhöht keine Beitragssterne.'],guideSync:['已登录时，进度随账户保存；不是必须完成的任务。','When signed in, progress is saved to your account. These steps are optional.','Angemeldet wird der Fortschritt im Konto gespeichert. Die Schritte sind optional.'],guideGuest:['当前为访客预览；登录后可以保存指南进度。','Guest preview. Sign in to save your progress.','Gastvorschau. Zum Speichern bitte anmelden.'],
 guide1:['认识你的账户','Your account','Dein Konto'],guide1body:['先打开个人页，设置显示名称和个人介绍。邮箱仅作私有登录名，无需确认邮件；名称与介绍会公开。请妥善保存密码，本站目前不提供邮件找回。','Open your profile and set your display name and bio. Email is a private login name; no confirmation email is needed. Your name and bio are public. Keep your password safe; email recovery is not currently available.','Öffne dein Profil und lege Anzeigenamen und Biografie fest. Die E-Mail ist ein privater Anmeldename; keine Bestätigungsmail nötig. Name und Biografie sind öffentlich. Passwort sicher verwahren; E-Mail-Wiederherstellung ist derzeit nicht verfügbar.'],guide1action:['打开个人页','Open profile','Profil öffnen'],
 guide2:['先读语境，再看标签','Read context before labels','Erst Kontext, dann Labels'],guide2body:['在公开库选择一条语料，点击“查看语境”。阅读原文、上下文与释义；语义模糊样本有独立入口。Hashtag 是主题线索，不等于已经确认的分类。热门榜统计本站近 7 天真实研判关联次数。','Choose a sample in the corpus and open its context. Read the original, context and explanation. Ambiguous samples have their own collection. Hashtags are topic clues, not confirmed classifications. Trends count actual annotation events over the last 7 days.','Wähle einen Beleg und öffne seinen Kontext. Lies Original, Kontext und Erläuterung. Mehrdeutige Belege haben eine eigene Sammlung. Hashtags sind Themenhinweise, keine bestätigten Klassen. Trends zählen echte Annotationen der letzten 7 Tage.'],guide2action:['浏览公开语料','Browse the corpus','Korpus ansehen'],
 guide3:['贡献一条新语料','Contribute a new sample','Einen Beleg beitragen'],guide3body:['在“添加语料”填写原文、上下文、建议标签和可选 Hashtag，也可以用 TXT 或单条 JSON 辅助填写。先移除真实姓名、账号、地址与私信隐私，确认分享权。投稿进入公开待审区，通过前不会加入正式库。','Use Contribute to provide text, context, a proposed label and optional hashtags. TXT or a single JSON object can help fill the form. Remove names, handles, addresses and private messages, and confirm your right to share. Submissions enter public review before publication.','Trage Text, Kontext, vorgeschlagenes Label und optionale Hashtags ein. TXT oder ein einzelnes JSON-Objekt können beim Ausfüllen helfen. Namen, Konten, Adressen und Privatnachrichten entfernen und Teilungsrecht bestätigen. Neue Belege gehen zuerst in die öffentliche Prüfung.'],guide3action:['打开投稿表单','Open submission form','Einreichung öffnen'],
 guide4:['独立研判，不猜官方结论','Review independently','Unabhängig prüfen'],guide4body:['不能审核自己的投稿，每个账户每条语料只能提交一次有依据的判断。至少 5 个账户参与后，某个标签获得全部有效票的至少 60% 才会入库。“不建议入库”也计入分母；语义模糊可以作为正式标签。投票后不能改票。','Do not review your own submission. Each account gets one reasoned review per sample. At least 5 accounts must review, and a label needs at least 60% of all valid votes. Rejections count in the denominator; ambiguity is a valid label. Reviews cannot be changed.','Keine Eigenprüfung. Pro Konto und Beleg eine begründete Prüfung. Mindestens 5 Konten und mindestens 60 % aller gültigen Stimmen für ein Label sind nötig. Ablehnungen zählen im Nenner; Mehrdeutigkeit ist ein gültiges Label. Stimmen sind endgültig.'],guide4action:['进入社区研判','Open community review','Community-Prüfung öffnen'],
 guide5:['互动、下线与贡献星级','Discussion, withdrawal and stars','Austausch, Rücknahme und Sterne'],guide5body:['已入库语料支持点赞、点踩和留言；点踩需要选择原因。至少 5 人表态且点踩比例严格超过 60% 时，语料进入公开下线区，保留触发票数和原因，仍可评论。个人星级按已入库语料数累计：1 / 5 / 15 / 30 / 60 条对应 1–5 星。','Published samples accept likes, dislikes and comments. Dislikes need a reason. After at least 5 reactions, a dislike share strictly above 60% moves the sample into the public archive with its trigger counts and reasons; discussion stays open. Accepted contributions earn 1–5 stars at 1 / 5 / 15 / 30 / 60 samples.','Freigegebene Belege können bewertet und kommentiert werden. Ablehnung braucht einen Grund. Ab 5 Reaktionen und über 60 % Ablehnung geht der Beleg ins öffentliche Archiv mit Stimmenstand und Gründen; Diskussion bleibt offen. 1 / 5 / 15 / 30 / 60 aufgenommene Belege ergeben 1–5 Sterne.'],guide5action:['查看下线区与规则','View withdrawal records','Rücknahmen ansehen'],
 quoteSource:['Ludwig Wittgenstein ·《逻辑哲学论》5.6','Ludwig Wittgenstein · Tractatus Logico-Philosophicus, 5.6','Ludwig Wittgenstein · Tractatus logico-philosophicus, 5.6'],
withdrawnEmpty:['暂无下线记录','No withdrawals recorded','Keine Rücknahmen verzeichnet'],withdrawnEmptyDesc:['触发社区下线条件后，语料和原因会自动出现在这里。','When a sample reaches the withdrawal threshold, its text and reason appear here automatically.','Sobald die Rücknahmeschwelle erreicht ist, erscheinen Beleg und Grund automatisch hier.'],
 withdrawn:['下线语料','Withdrawn corpus','Zurückgezogene Belege'],withdrawnDesc:['保留社区下线记录与触发原因。语料移出正式库，但仍可在这里查看和讨论。','A transparent record of community withdrawals and their triggers. Samples leave the active corpus but remain available for discussion here.','Transparente Dokumentation der Rücknahmen und Gründe. Belege verlassen das aktive Korpus, bleiben hier aber diskutierbar.'],withdrawnBadge:['已下线 · 公开存档','Withdrawn · public archive','Zurückgezogen · öffentliches Archiv'],withdrawalTitle:['为什么这条语料下线？','Why was this sample withdrawn?','Warum wurde dieser Beleg zurückgezogen?'],withdrawalRule:['至少 5 个账户表态，点踩人数 ÷（点赞＋点踩人数）严格超过 60% 后，自动移入下线区。恰好 60% 不下线。','After at least 5 accounts react, a dislike share strictly above 60% moves the sample to the public archive. Exactly 60% stays published.','Ab mindestens 5 Reaktionen führt ein Ablehnungsanteil von mehr als 60 % ins öffentliche Archiv. Genau 60 % genügen nicht.'],withdrawalReason:['社区负向反馈超过阈值','Community disapproval exceeded the threshold','Ablehnungsschwelle der Community überschritten'],withdrawalAt:['下线时间','Withdrawn on','Zurückgezogen am'],snapshot:['触发时的票数快照','Vote snapshot at withdrawal','Stimmenstand bei Rücknahme'],reactionFrozen:['下线时冻结态度票，保留记录；评论仍可继续。','Reactions are frozen at withdrawal; discussion remains open.','Reaktionen werden bei Rücknahme eingefroren; Diskussionen bleiben möglich.'],dislike:['▽ 点踩','▽ Dislike','▽ Ablehnen'],disliked:['▼ 已点踩','▼ Disliked','▼ Abgelehnt'],dislikes:['点踩','Dislikes','Ablehnungen'],dislikeRatio:['负向比例','Dislike share','Ablehnungsanteil'],reactTotal:['表态人数','Accounts reacting','Reagierende Konten'],dislikeReason:['点踩原因','Reason for disapproval','Grund der Ablehnung'],context_incomplete:['语境不足或无法核对','Insufficient or unverifiable context','Unzureichender oder nicht prüfbarer Kontext'],label_disputed:['分类标签有争议','Disputed classification','Umstrittene Einordnung'],low_quality:['重复、低质量或研究价值不足','Duplicate, low quality or limited research value','Duplikat, geringe Qualität oder Forschungswert'],other:['其他问题','Other concerns','Andere Bedenken'],dislikeSend:['提交点踩','Submit dislike','Ablehnung senden'],dislikeHelp:['点赞与点踩互斥；再次点击同一态度可取消。该态度针对语料质量与分类，不针对投稿者。','Likes and dislikes are mutually exclusive; repeat the same action to undo it. Evaluate the sample, not its contributor.','Zustimmung und Ablehnung schließen sich aus; erneutes Klicken hebt die Reaktion auf. Bewerte den Beleg, nicht die Person.'],archivedNotice:['这条语料已转入公开下线区。','This sample has moved to the public withdrawal archive.','Dieser Beleg wurde ins öffentliche Rücknahmearchiv verschoben.'],
 trending:['热门 Hashtag','Trending hashtags','Trendende Hashtags'],trendingDesc:['近 7 天 · 按实际研判关联次数排序','Last 7 days · ranked by annotation events','Letzte 7 Tage · nach Annotationsereignissen'],trendingEmpty:['等待第一束标注信号','Waiting for the first annotation signal','Warten auf das erste Annotationssignal'],trendingEmptyDesc:['目前没有近 7 天的研判记录。完成社区标注后，热门 Hashtag 会在这里自动出现。','No annotation events in the last 7 days. Hashtags will appear here as the community reviews samples.','Keine Annotationen in den letzten 7 Tagen. Nach Community-Prüfungen erscheinen hier die Hashtags.'],annotationEvents:['次研判关联','annotation events','Annotationsereignisse'],relatedSamples:['条关联语料','related samples','zugehörige Belege'],hashtags:['Hashtag 主题','Hashtags','Hashtags'],hashtagHelp:['可选，空格或逗号分隔；仅字母、数字、下划线。原文中的 #Hashtag 自动提取；含系统标签共最多 8 个，每个最多 32 字符。','Optional, separated by spaces or commas; letters, numbers and underscores only. Hashtags in the text are extracted automatically. Up to 8 including the system label; 32 characters each.','Optional, durch Leerzeichen oder Kommas trennen; nur Buchstaben, Ziffern und Unterstrich. Hashtags im Text werden automatisch erkannt. Insgesamt höchstens 8 einschließlich Systemlabel, je 32 Zeichen.'],hashtagView:['Hashtag 语料','Hashtag samples','Hashtag-Belege'],hashtagDesc:['已入库与待研判语料，按公开状态分别标记。','Published and pending samples, each with a clear status.','Freigegebene und offene Belege, jeweils klar gekennzeichnet.'],trendingMethod:['每条实际研判记录为该语料的每个 Hashtag 记 1 次关联。仅统计近 7 天且仍在公开库或待审区的语料；这不是全网热度，也不是独立用户数。','Each review event contributes one count to each hashtag on its sample. Only the last 7 days of active or pending samples are counted. This is not global popularity or a unique-user count.','Jede Prüfung zählt einmal für jeden Hashtag des Belegs. Nur die letzten 7 Tage aktiver oder offener Belege zählen. Kein Maß für globale Popularität oder einzigartige Personen.'],

 subtitle:['德语 × 语境 × 共同理解','Language, in good context.','Sprache im richtigen Kontext.'],openlab:['一个共同生长的语言智库','A living library of context','Ein wachsendes Spracharchiv'],hero:['一句话，<em>不止一种意思。</em>','One sentence.<br><em>More than one meaning.</em>','Ein Satz.<br><em>Mehr als eine Bedeutung.</em>'],heroDesc:['收集德语表达，记录它出现的语境。一起讨论、研判，让有依据的理解成为共享知识。','Collect expressions. Preserve their context. Turn thoughtful, community-reviewed interpretations into shared knowledge.','Ausdrücke sammeln, Kontext bewahren, gemeinsam prüfen. So wird begründetes Verstehen zu geteiltem Wissen.'],
 contribute:['＋ 添加新语料','＋ Add a sample','＋ Beleg hinzufügen'],explore:['浏览语料库 ↗','Explore the corpus ↗','Korpus entdecken ↗'],accepted:['已入库语料','Published samples','Veröffentlichte Belege'],pending:['等待共同研判','Awaiting review','Warten auf Prüfung'],ambiguousCount:['语义模糊样本','Ambiguous samples','Mehrdeutige Belege'],members:['共建者','Contributors','Mitwirkende'],ruleShort:['5 人起审 · 标签认同率 ≥ 60%','5 reviewers · ≥ 60% agreement','5 Prüfende · ≥ 60 % Zustimmung'],sideCopy:['不急着判断。<br>先把语境放回去。','Before you judge,<br>put the context back.','Erst den Kontext verstehen.<br>Dann urteilen.'],sideLink:['了解共建规则 →','Read the community rules →','Gemeinschaftsregeln →'],

 search:['搜索原文、释义或上下文…','Search text, notes or context…','Text, Erläuterung oder Kontext suchen…'],newest:['最新提交','Newest first','Neueste zuerst'],popular:['最多点赞','Most liked','Meiste Likes'],clear:['清除筛选','Clear filters','Filter löschen'],read:['查看语境 ↗','Open context ↗','Kontext öffnen ↗'],seed:['编辑精选 · 虚构案例','Curated · fictional','Redaktionell · fiktiv'],community:['社区共识入库','Community-reviewed','Community-geprüft'],unreviewed:['待研判 · 未入库','Pending · not published','In Prüfung · nicht aufgenommen'],empty:['这里还没有语料','Nothing here yet','Noch keine Belege'],emptyDesc:['换个筛选条件，或提交第一条语料。','Try a different filter, or contribute the first sample.','Filter ändern oder den ersten Beleg einreichen.'],noPending:['暂时没有待研判投稿','No submissions waiting','Keine offenen Einreichungen'],firstSubmit:['你可以提交一条新的表达，让大家一起理解它。','Contribute an expression for the community to explore.','Reiche einen Ausdruck zur gemeinsamen Prüfung ein.'],
 reviewDesc:['每个账户一票，不能审核自己的投稿。达到 5 票后，任一标签获得全部有效票的至少 60%，自动入库。','One vote per account; no self-review. After at least 5 votes, a label needs 60% of all valid votes to publish.','Eine Stimme pro Konto, keine Eigenprüfung. Ab 5 Stimmen sind mindestens 60 % aller Stimmen für ein Label nötig.'],ambDesc:['为指代不明、立场不清或缺失上下文的表达保留空间。已入库的模糊样本与待审投稿分开展示。','A home for unclear reference, uncertain stance and missing context. Published ambiguity and pending submissions stay distinct.','Raum für unklare Referenzen, Haltungen und fehlenden Kontext. Freigegebene und offene Belege bleiben getrennt.'],
 votes:['有效研判票','Review votes','Gültige Prüfungen'],lead:['领先标签认同率','Leading label share','Anteil des führenden Labels'],likes:['点赞','Likes','Likes'],comments:['讨论','Discussion','Diskussion'],context:['上下文','Context','Kontext'],translation:['补充释义','Additional explanation','Zusätzliche Erläuterung'],suggested:['投稿者建议标签','Suggested label','Vorgeschlagenes Label'],final:['入库标签','Published label','Veröffentlichtes Label'],secondary:['投稿者附加标签（未经单独共识）','Contributor tags (not separately ratified)','Zusatzlabels (nicht separat bestätigt)'],created:['提交于','Submitted','Eingereicht'],author:['贡献者','Contributor','Mitwirkende'],curator:['KontextLab 编辑','KontextLab editorial','KontextLab-Redaktion'],fiction:['此条为原创虚构研究样本，未经过社区投票。','An original fictional research example, curated without a community vote.','Ein fiktiver Forschungsbeleg, redaktionell ohne Community-Abstimmung aufgenommen.'],contentWarning:['可能包含攻击或威胁表达，仅供语境研究。','May contain hostile or threatening language, shown for contextual research.','Kann abwertende oder bedrohliche Sprache enthalten; dient der Kontextanalyse.'],
 chooseVote:['你认为最合适的标签是？','Which label fits best?','Welches Label passt am besten?'],voteHelp:['这是对分类与研究价值的判断，不是平台违规裁决。弃权请勿提交；“不建议入库”计入总票数，但不支持任何标签。','Assess the classification and research value, not platform enforcement. Abstain by not voting. “Do not publish” counts in the denominator.','Bewerte Einordnung und Forschungswert, kein Plattformurteil. Für Enthaltung nicht abstimmen. „Nicht veröffentlichen“ zählt im Nenner.'],reason:['判断依据','Reasoning','Begründung'],reasonPlaceholder:['请结合具体词句、语境和不确定性说明（至少 5 字符）…','Explain the wording, context and uncertainty (at least 5 characters)…','Wortlaut, Kontext und Unsicherheit erläutern (mindestens 5 Zeichen)…'],voteSend:['提交独立研判','Submit review','Prüfung abgeben'],voted:['你已研判此投稿','Your review is recorded','Deine Prüfung ist gespeichert'],selfVote:['这是你的投稿，等待其他账户独立研判。','Your sample is waiting for independent reviewers.','Dein Beleg wartet auf unabhängige Prüfungen.'],hiddenVotes:['提交前暂不显示票数分布，减少从众影响。','Vote distribution is hidden until you submit a review.','Stimmverteilung wird erst nach deiner Prüfung gezeigt.'],voteLocked:['研判提交后不可修改，入库后自动关闭投票。','Reviews are final. Voting closes once a sample is published.','Abgegebene Prüfungen sind endgültig. Nach Freigabe endet die Abstimmung.'],
 like:['♡ 赞一个','♡ Like','♡ Gefällt mir'],liked:['♥ 已点赞','♥ Liked','♥ Gefällt dir'],report:['举报此语料','Report sample','Beleg melden'],reportReason:['举报原因（至少 5 字符）','Reason for report (min. 5 characters)','Meldegrund (mind. 5 Zeichen)'],reportSend:['提交举报','Send report','Meldung senden'],reportThanks:['举报已交由管理员查看。','Report sent to moderators.','Meldung an die Moderation gesendet.'],commentPlaceholder:['补充一种理解，也说说你的依据…','Offer an interpretation and explain why…','Ergänze eine Deutung mit Begründung…'],commentSend:['发布留言','Post comment','Kommentar senden'],commentHelp:['留言公开显示。请勿发布个人隐私、攻击或垃圾信息；自己的留言可以删除。','Comments are public. No private data, attacks or spam. You can delete your own comments.','Kommentare sind öffentlich. Keine privaten Daten, Angriffe oder Spam. Eigene Kommentare sind löschbar.'],noComments:['还没有讨论，留下第一种理解。','No discussion yet. Add the first interpretation.','Noch keine Diskussion. Ergänze die erste Deutung.'],delete:['删除','Delete','Löschen'],
 submitDesc:['把一句表达和它发生的情境一起带来。新投稿先进入公开研判区，通过共识审核才进入正式语料库。','Bring an expression and the situation around it. New samples enter public review before joining the corpus.','Bringe einen Ausdruck und seinen Kontext mit. Neue Belege gehen vor der Aufnahme in die öffentliche Prüfung.'],sampleText:['语料原文','Original expression','Originalbeleg'],samplePlaceholder:['例如：Na, du bist ja wirklich ein Genie. 🙄','e.g. Na, du bist ja wirklich ein Genie. 🙄','z. B. Na, du bist ja wirklich ein Genie. 🙄'],contextPlaceholder:['描述前后文、人物关系、互动历史；缺失的信息也请明确写出。','Describe surrounding text, relationships and interaction history. State what is missing.','Beschreibe Gespräch, Beziehungen und Verlauf. Benenne fehlende Informationen.'],language:['语料语言','Sample language','Belegsprache'],optional:['可选','Optional','Optional'],consent:['我确认已去除个人信息，并有权公开分享该文本及上下文。','I removed personal data and have the right to share this text and context publicly.','Ich habe personenbezogene Daten entfernt und darf Text und Kontext öffentlich teilen.'],submitSend:['提交到社区研判 →','Submit for community review →','Zur Prüfung einreichen →'],fileImport:['从 TXT / JSON 文件填写','Fill from TXT / JSON','Aus TXT / JSON ausfüllen'],fileHelp:['单条投稿；TXT 填入原文，JSON 可含 text、context、translation 字段。导入后仍需确认提交。','One sample per submission. TXT fills the text; JSON supports text, context and translation. Review before submitting.','Ein Beleg pro Einreichung. TXT füllt den Text; JSON unterstützt text, context und translation. Vor dem Absenden prüfen.'],submitRules:['好的语料，始于好的语境。','Good examples start with good context.','Gute Belege brauchen guten Kontext.'],submitTips:['请优先提交原创虚构或有权分享的去标识化表达。不要上传真实姓名、账号、地址和私信隐私。每账户每天最多 10 条。标签只是提议，最终分类由社区研判决定。','Prefer original fictional or authorized, anonymized material. Do not include names, handles, addresses or private messages. Limit: 10 samples per account per day. Your label is a proposal; reviewers decide the final classification.','Bevorzuge eigene fiktive oder zulässige anonymisierte Belege. Keine Namen, Konten, Adressen oder privaten Nachrichten. Höchstens 10 Belege pro Konto und Tag. Das vorgeschlagene Label ist noch kein Beschluss.'],
 login:['登录','Sign in','Anmelden'],signup:['注册','Sign up','Registrieren'],logout:['退出登录','Sign out','Abmelden'],loginNeeded:['请先登录账户，再参与共建。','Sign in to contribute.','Melde dich an, um mitzuwirken.'],authTitle:['让你的理解，成为一份贡献。','Make your understanding count.','Dein Verständnis zählt.'],email:['电子邮箱','Email address','E-Mail-Adresse'],password:['密码（至少 8 位）','Password (at least 8 characters)','Passwort (mindestens 8 Zeichen)'],authNote:['邮箱仅作登录名，不公开、不发送验证邮件。注册后即可参与；请妥善保存密码。','Email is a private login name. No verification email is sent; contribute immediately after registration. Keep your password safe.','Die E-Mail dient als privater Anmeldename. Keine Bestätigungsmail; nach Registrierung direkt mitwirken. Passwort sicher aufbewahren.'],checkEmail:['注册请求已发送，请查看确认邮件。若收不到邮件，可能需要站点管理员配置邮件服务。','Check your inbox for confirmation. If no email arrives, the site owner may need to configure email delivery.','Bitte Bestätigungsmail prüfen. Falls keine ankommt, muss die Website ggf. den Mailversand konfigurieren.'],forgot:['发送密码重置邮件','Send password reset email','Passwort-Reset senden'],resetSent:['若邮箱已注册，将收到重置邮件。','If registered, this email will receive a reset link.','Falls registriert, erhält diese Adresse einen Reset-Link.'],newPassword:['设置新密码','Set a new password','Neues Passwort setzen'],resetPassword:['更新密码','Update password','Passwort aktualisieren'],
 publicProfile:['公开个人页','Public profile','Öffentliches Profil'],profileDesc:['记录你为共同理解留下的每一份贡献。','A record of what you bring to our shared understanding.','Dein Beitrag zum gemeinsamen Verstehen.'],name:['显示名称','Display name','Anzeigename'],bio:['个人介绍','About you','Über dich'],save:['保存资料','Save profile','Profil speichern'],submitted:['已提交语料','Submitted samples','Eingereichte Belege'],published:['社区入库贡献','Accepted contributions','Aufgenommene Beiträge'],reviewed:['完成研判','Reviews completed','Abgegebene Prüfungen'],nextStar:['距离下一颗星','To the next star','Bis zum nächsten Stern'],maxStar:['已达到最高星级','Maximum level reached','Höchste Stufe erreicht'],starRule:['按入库语料累计星级：0 / 1 / 5 / 15 / 30 / 60 条对应 0–5 星。点赞、留言和单纯投票不增加星级。','Accepted samples earn stars: 0 / 1 / 5 / 15 / 30 / 60 samples = 0–5 stars. Likes, comments and voting do not earn stars.','Aufgenommene Belege ergeben Sterne: 0 / 1 / 5 / 15 / 30 / 60 Belege = 0–5 Sterne. Likes, Kommentare und Stimmen erhöhen die Stufe nicht.'],mySamples:['贡献的语料','Contributed samples','Eingereichte Belege'],join:['加入共建','Join the community','Gemeinsam mitwirken'],
 methodsTitle:['共识可以计算，语境不能省略。','Count the consensus. Keep the context.','Konsens zählen. Kontext bewahren.'],m1:['提交与公开研判','Submission & public review','Einreichung & öffentliche Prüfung'],m1d:['登录用户提交原文、上下文、建议标签和可选附加标签。投稿先公开出现在待研判区，不属于正式库。','Signed-in users submit text, context, a proposed label and optional contributor tags. Pending samples are publicly visible but not part of the published corpus.','Angemeldete Nutzer reichen Text, Kontext, Vorschlag und optionale Zusatzlabels ein. Offene Belege sind öffentlich, gehören aber noch nicht zum freigegebenen Korpus.'],m2:['独立账户，一人一票','One account, one review','Ein Konto, eine Prüfung'],m2d:['投稿者不能自审；每账户每条投稿只可提交一次有依据的标签票。未投票不计分母，“不建议入库”计入分母。账户不等于真实独立个人，仍可能存在多账户操纵。','No self-review. Each account submits one reasoned label vote per sample. Abstentions are excluded; rejections count in the denominator. Accounts do not prove unique people, so coordinated manipulation remains possible.','Keine Eigenprüfung. Pro Konto und Beleg eine begründete Stimme. Enthaltungen zählen nicht, Ablehnungen schon. Konten belegen keine einzigartigen Personen; Manipulation bleibt möglich.'],m3:['至少 5 票，单一标签 ≥ 60%','At least 5 votes, one label ≥ 60%','Mindestens 5 Stimmen, ein Label ≥ 60 %'],m3d:['标签认同率＝该标签票数÷全部有效票数。满足门槛后，服务器原子地将投稿入库并锁定投票。3/5 通过，2/5 不通过；未达门槛继续等待。附加标签不会自动被认定为共识标签。','Label agreement = votes for that label / all valid votes. Once the threshold is met, the server publishes and locks the sample atomically. 3/5 passes; 2/5 does not. Contributor tags are not automatically community-approved.','Labelzustimmung = Stimmen für das Label / alle gültigen Stimmen. Bei Erreichen veröffentlicht der Server atomar und schließt die Abstimmung. 3/5 genügt, 2/5 nicht. Zusatzlabels sind kein bestätigter Konsens.'],m4:['模糊性单独保存','Preserve ambiguity','Mehrdeutigkeit bewahren'],m4d:['“语义模糊”是正式可选标签。它表示证据不足、指代或立场不清，不等同于违规。投稿中建议的模糊标签仍需审核。','Ambiguity is a first-class label for insufficient evidence or unclear reference and stance, not a violation. Proposed ambiguity still requires review.','Mehrdeutigkeit ist ein eigenes Label für fehlende Belege oder unklare Referenz und Haltung, kein Verstoß. Auch dieser Vorschlag muss geprüft werden.'],m5:['公开讨论，持续维护','Public discussion & stewardship','Öffentliche Diskussion & Pflege'],m5d:['已入库语料可点赞、留言、举报。管理员可依据举报下架或重开研判。编辑精选案例独立标识；社区标签是研究共识，不是 TikTok 官方裁决。','Published samples support likes, comments and reports. Moderators can hide samples or reopen review. Curated examples are marked separately; community labels are research consensus, not official TikTok decisions.','Freigegebene Belege können gelikt, kommentiert und gemeldet werden. Moderation kann ausblenden oder neu prüfen lassen. Redaktionelle Beispiele sind gekennzeichnet; Konsens ist kein offizielles TikTok-Urteil.'],

lable.','E-Mail-Inhaberschaft wird nicht geprüft. Konten belegen keine einzigartigen Personen, Konsens ist keine Wahrheit. Passwortwiederherstellung per E-Mail ist derzeit nicht verfügbar.']

const thresholds=[0,1,5,15,30,60];
function level(n){let stars=0;for(let i=1;i<thresholds.length;i++)if(n>=thresholds[i])stars=i;let start=thresholds[stars],end=thresholds[stars+1];return{stars,next:end??null,percent:end?Math.min(100,(n-start)/(end-start)*100):100}}
function route(){let r=(location.hash||'#library').slice(1).split('/')[0];return ['library','review','ambiguous','submit','profile','member','methods','lab','admin','withdrawn','hashtag','guide'].includes(r)?r:'library'}
function name(id){return profiles.find(p=>p.id===id)?.display_name||t('curator')}
function summary(id){return stats.samples.find(s=>s.id===id)||{votes:0,likes:0,dislikes:0,comments:0,ballots:{}}}
function contribution(id){return stats.contributors.find(p=>p.id===id)||{submitted:0,accepted:0,reviews:0}}
function leading(s){let [key,n]=Object.entries(s.ballots||{}).filter(([k])=>k!=='reject').sort((a,b)=>b[1]-a[1])[0]||[null,0];return {key,n,ratio:s.votes?n/s.votes:0}}
function date(s){return new Date(s).toLocaleDateString({zh:'zh-CN',en:'en-GB',de:'de-DE'}[lang])}
function notify(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastId);window.toastId=setTimeout(()=>$('#toast').style.display='none',5000)}
function humanError(e){const raw=e?.message||String(e);const code=Object.keys(E).find(k=>raw.includes(k));if(code)return E[code][{zh:0,en:1,de:2}[lang]];if(/duplicate key/.test(raw))return {zh:'你已提交过该操作，请刷新查看。',en:'Already submitted. Refresh to view.',de:'Bereits gesendet. Zum Anzeigen aktualisieren.'}[lang];return raw}

$('#footer').innerHTML=`<span>${t('footer')}</span><span>${t('footerRight')} · <a href="https://github.com/hallodongyue-lang/kontextlab" target="_blank" rel="noopener">GitHub ↗</a></span>`;
$('#guide-help').onclick=()=>{guideIndex=null;location.hash='guide';render()};$('#locale').onchange=e=>{lang=e.target.value;setPref('kl-language',lang);$('#dialog').close();render()};$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';setPref('kl-theme',theme);document.documentElement.dataset.theme=theme;renderShell()};$('#refresh').onclick=()=>refresh().then(()=>notify(t('loaded'))).catch(catchError);if(user)$('#logout').onclick=async()=>{let {error}=await db.auth.signOut();if(error)return catchError(error);user=null;myVotes=[];myLikes=[];render()};else{$('#login').onclick=()=>authDialog('login');$('#join').onclick=()=>authDialog('signup')}}
function countsPanel(){return `<div class="stats">${[[samples.filter(s=>s.status==='approved').length,'accepted'],[samples.filter(s=>s.status==='pending').length,'pending'],[samples.filter(s=>s.status==='approved'&&s.final_tag==='ambiguous').length,'ambiguousCount'],[samples.filter(s=>s.status==='withdrawn').length,'withdrawn']].map(([v,k])=>`<div class="stat"><strong>${v.toString().padStart(2,'0')}</strong><span>${t(k)}</span></div>`).join('')}</div>`}

function renderCorpus(r){const hero=r==='library'?`<section class="hero cyber-hero"><div class="hero-copy">${stellarTitle()}<div class="eyebrow">${t('openlab')}</div><h1 class="wittgenstein-quote" lang="de">Die Grenzen meiner Sprache bedeuten die Grenzen meiner Welt.</h1><p class="quote-attribution"><a href="https://www.gutenberg.org/files/5740/5740-pdf.pdf#page=146" target="_blank" rel="noopener">${t('quoteSource')} ↗</a></p><div class="inline"><a href="#submit" class="btn primary">${t('contribute')}</a><a href="#methods" class="btn quiet">${t('ruleShort')}</a></div></div><div class="cyber-orb" aria-hidden="true"><div class="orb-core">K<span>01 / CONTEXT</span></div><div class="orbit"></div><div class="orbit"></div><span class="orb-note">MEANING IS MULTIDIMENSIONAL</span></div></section>`:r==='hashtag'?`<div class="page-title"><p class="eyebrow">HASHTAG SIGNAL</p><h1>#${esc(activeHashtag())}</h1><p class="muted">${t('hashtagDesc')}</p></div>`:title(r,{review:'reviewDesc',ambiguous:'ambDesc',withdrawn:'withdrawnDesc'}[r]);$('#main').innerHTML=hero+countsPanel()+(r==='library'?hotHashtags():'')+`<div class="toolbar"><input type="search" id="search" aria-label="${t('search')}" placeholder="${t('search')}" value="${esc(query)}"><select id="sort" aria-label="${t('newest')}"><option value="newest" ${sort==='newest'?'selected':''}>${t('newest')}</option><option value="popular" ${sort==='popular'?'selected':''}>${t('popular')}</option></select></div>${!['ambiguous','hashtag'].includes(r)?`<div class="filters">${['',...TAGS].map(k=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}">${k?tag(k):t('all')}</button>`).join('')}</div>`:''}${r==='review'?`<div class="notice">${t('contentWarning')}<br>${t('hiddenVotes')}</div>`:r==='withdrawn'?`<div class="notice">${t('withdrawalRule')}</div>`:''}<div class="grid" id="corpus-grid"></div><div class="pagination" id="pagination"></div>`;$('#search').oninput=e=>{query=e.target.value;page=1;renderCards(r)};$('#sort').onchange=e=>{sort=e.target.value;page=1;renderCards(r)};$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;page=1;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderCards(r)});renderCards(r)}

function renderGuide(){const p=user?profiles.find(p=>p.id===user.id):null;const done=p?.onboarding_completed_at;const progress=p?(p.onboarding_step||0):guestGuideProgress;const i=guideIndex??Math.min(progress,4);const routes=['profile','library','submit','review','withdrawn'];$('#main').innerHTML=title('guide','guideIntro')+`<section class="onboarding-shell"><div class="guide-map">${[0,1,2,3,4].map(n=>`<button data-guide-step="${n}" class="guide-map-step ${i===n?'current':''} ${progress>n?'done':''}"><span>${progress>n?'✓':String(n+1).padStart(2,'0')}</span><b>${t('guide'+(n+1))}</b></button>`).join('')}</div><div class="panel guide-panel"><p class="eyebrow">${String(i+1).padStart(2,'0')} / 05</p><h2>${t('guide'+(i+1))}</h2><p class="guide-explanation">${t('guide'+(i+1)+'body')}</p><a class="btn" href="#${routes[i]}">${t('guide'+(i+1)+'action')} ↗</a><div class="guide-progress"><div class="inline" style="justify-content:space-between"><span class="fine">${t('guideProgress')}</span><b>${progress} / 5</b></div><div class="progress"><span style="width:${progress/5*100}%"></span></div><p class="fine">${user?t('guideSync'):t('guideGuest')}</p></div>${done?`<div class="notice"><strong>✓ ${t('guideDone')}</strong><p>${t('guideDoneText')}</p></div>`:''}<div class="guide-actions"><button id="guide-back" ${i===0?'disabled':''}>${t('guideBack')}</button><button id="guide-next" class="primary">${t(i===4?'guideFinish':'guideNext')} →</button><button id="guide-later" class="quiet">${t('guideLater')}</button></div></div></section>`;$$('[data-guide-step]').forEach(b=>b.onclick=()=>{guideIndex=Number(b.dataset.guideStep);renderGuide()});$('#guide-back').onclick=()=>{guideIndex=Math.max(0,i-1);renderGuide()};$('#guide-later').onclick=()=>{if(user){guideAutoSeen.add(user.id);setPref('kl-guide-later-'+user.id,String(Date.now()+86400000))}location.hash='library'};$('#guide-next').onclick=e=>action(e.target,async()=>{const next=Math.max(progress,i+1);if(user){const update={onboarding_step:next};if(next===5)update.onboarding_completed_at=new Date().toISOString();const {error}=await db.from('kl_profiles').update(update).eq('id',user.id);if(error)throw error;Object.assign(p,update)}else guestGuideProgress=next;guideIndex=i===4?4:i+1;if(i===4){notify(t('guideDone'));if(!user)location.hash='library';else renderGuide()}else renderGuide()})}

research:['研究看板','Research dashboard','Forschungsübersicht'],experiment:['语境对照实验','Context experiment','Kontextvergleich'],privacy:['数据与隐私','Data & privacy','Daten & Datenschutz'],advanced:['高级检索','Advanced search','Erweiterte Suche'],relation:['社会关系','Social relationship','Soziale Beziehung'],phenomenon:['语言现象','Language phenomenon','Sprachphänomen'],scene:['交际场景','Setting','Situation'],unknown:['未标注','Unspecified','Nicht annotiert'],friends:['朋友之间','Friends','Freundschaft'],hierarchy:['上下级','Workplace hierarchy','Hierarchie'],strangers:['陌生人','Strangers','Fremde'],praise:['赞美','Praise','Lob'],irony:['讽刺','Irony','Ironie'],uncertain:['无法确定','Uncertain','Unklar'],work:['工作','Work','Arbeit'],social:['社交','Social','Sozial'],public:['公共讨论','Public discussion','Öffentliche Diskussion'],literal:['字面表达','Literal expression','Wörtlicher Ausdruck'],metaphor:['隐喻','Metaphor','Metapher'],quotation:['引用','Quotation','Zitat'],dispute:['争议程度','Disagreement','Uneinigkeit'],contested:['有分歧（至少5票，领先标签<80%）','Contested (≥5 votes, leading label <80%)','Umstritten (≥5 Stimmen, führendes Label <80 %)'],insufficient:['不足5票','Fewer than 5 votes','Weniger als 5 Stimmen'],stable:['领先标签≥80%（至少5票）','Leading label ≥80% (≥5 votes)','Führendes Label ≥80 % (≥5 Stimmen)'],all:['全部','All','Alle'],export:['导出当前筛选','Export filtered samples','Gefilterte Belege exportieren'],baseline:['第一步：仅阅读表达，提交初始判断','Step 1: Interpret the expression alone','Schritt 1: Ausdruck ohne Kontext deuten'],reveal:['锁定初始判断，揭示语境','Lock judgment and reveal context','Urteil festhalten und Kontext zeigen'],after:['第二步：补充语境后的判断','Step 2: Interpret with context','Schritt 2: Mit Kontext deuten'],reason:['判断改变或保持的原因','Why did your judgment change or stay?','Warum hat sich dein Urteil geändert oder bestätigt?'],save:['保存实验记录','Save experiment record','Versuch speichern'],consent:['自愿将本次选择纳入公开汇总；理由仅自己可见','Include these choices in public aggregates voluntarily; reasoning stays private','Diese Auswahl freiwillig in öffentliche Summen aufnehmen; Begründung bleibt privat'],protocol:['探索性重复测量，协议 context-1.0。先判断，再揭示语境；不判对错。可自行选择关系，顺序未随机，情境事件也不同，不能单独归因于社会关系或推广到总体。访客可以试用，登录后保存。','Exploratory repeated measures, protocol context-1.0. Judge before context is revealed. No correct answer. Relationship is self-selected and order is not randomized; events also differ, so no isolated relationship effect or population inference. Guests can try; sign in to save.','Explorative Messwiederholung, Protokoll context-1.0. Erst urteilen, dann Kontext lesen. Keine richtige Antwort. Beziehung selbst gewählt, Reihenfolge nicht randomisiert; Ereignisse variieren ebenfalls; keine isolierte Beziehungs- oder Populationaussage. Gäste können testen; Speichern nach Anmeldung.'],reset:['重新开始（清空未保存内容）','Restart (clear unsaved answers)','Neustart (ungespeicherte Antworten löschen)'],saved:['已保存；同一表达和关系每账户仅一条记录。','Saved; one record per expression and relationship per account.','Gespeichert; ein Datensatz pro Ausdruck und Beziehung je Konto.'],overview:['真实社区数据与虚构编辑语料分开统计。共识不是正确率；争议=至少5票且领先标签低于80%。没有票时不显示假百分比。','Real community activity and fictional curated samples are counted separately. Consensus is not accuracy. Contested = ≥5 votes and leading label <80%. No invented percentages for zero votes.','Echte Community-Aktivität und fiktive redaktionelle Belege getrennt. Konsens ist keine Genauigkeit. Umstritten = ≥5 Stimmen und führendes Label <80 %. Keine erfundenen Prozentwerte ohne Stimmen.'],reasons:['自愿公开的判断理由（去除账户标识）','Voluntarily shared reasons (account identifiers removed)','Freiwillig geteilte Begründungen (ohne Kontokennung)'],noReasons:['暂无自愿公开的理由。旧标注默认不公开。','No voluntarily shared reasons. Older reviews are private by default.','Keine freiwillig geteilten Gründe. Frühere Prüfungen sind standardmäßig privat.'],privacyText:['语料、昵称、介绍与评论公开；邮箱不公开。实验原始记录和理由仅本人可见，仅明确同意的选择进入公开汇总。标注理由默认不公开，可逐条选择分享或撤回。移除账号标识不等于完全匿名：自由文本可能暴露身份，分享前请自行移除姓名、账号等信息。公开下载文件无法远程收回。','Samples, display names, bios and comments are public; email is private. Raw experiment records and reasons are owner-only; only opted-in choices enter public aggregates. Review reasons are private by default with per-review consent. Removing account IDs is not full anonymization: free text can identify people. Remove personal details before sharing. Downloaded copies cannot be recalled.','Belege, Anzeigenamen, Biografien und Kommentare sind öffentlich; E-Mail bleibt privat. Rohe Versuchsdaten und Gründe sind nur selbst sichtbar; nur freigegebene Entscheidungen fließen in Summen ein. Prüfgründe standardmäßig privat mit Einzelfreigabe. Ohne Konto-ID ist Text nicht vollständig anonym; persönliche Angaben vorher entfernen. Downloads lassen sich nicht zurückrufen.'],controls:['我的研究记录与分享设置','My research records & sharing','Meine Forschungsdaten & Freigaben'],withdraw:['撤回并停止纳入统计','Withdraw from aggregates','Aus Statistik zurückziehen'],restore:['恢复参与统计','Restore aggregate participation','Wieder in Statistik aufnehmen'],share:['分享此判断理由','Share this review reason','Diesen Prüfgrund teilen'],unshare:['撤回理由分享','Stop sharing reason','Freigabe zurücknehmen'],downloadMine:['下载我的研究数据 JSON','Download my research data JSON','Meine Forschungsdaten herunterladen'],erase:['申请删除／隐私处理','Request deletion / privacy action','Löschung / Datenschutz anfragen'],eraseHelp:['语料可在详情中举报并注明“隐私删除请求”；评论可自行删除。实验可立即撤回或恢复，也可永久删除本人的实验记录；删除会同步移出研究汇总。语料或账户删除需由维护者处理。目前不提供自动注销账户。','Report a sample with a privacy deletion request; delete your own comments. Experiments can be withdrawn or restored immediately; you can also permanently delete your experiment records, removing them from aggregates. Corpus or account deletion requires maintainer action. Automatic account deletion is not available.','Beleg mit Datenschutz-Löschanfrage melden; eigene Kommentare selbst löschen. Versuche sofort zurückziehen oder wiederherstellen; eigene Versuche auch endgültig löschen und damit aus Summen entfernen. Beleg- oder Kontolöschung beim Betreiber anfragen. Keine automatische Kontolöschung.'],exportNote:['导出仅包含当前可见语料、票数和自愿分享理由，不含邮箱、账户ID及评论。按语料ID关联。研究元数据为编辑补注或投稿者自报，未标注保持为空。CSV防止表格公式注入。','Exports contain visible samples, vote counts and opted-in reasons, without emails, account IDs or comments. Join by sample ID. Metadata is editorial or contributor-reported; unspecified stays empty. CSV protects against spreadsheet formula injection.','Export enthält sichtbare Belege, Stimmen und freigegebene Gründe ohne E-Mail, Konto-ID oder Kommentare. Verknüpfung über Beleg-ID. Metadaten sind redaktionell oder Selbstangaben; fehlende bleiben leer. CSV schützt vor Formelinjektion.'],metadata:['研究元数据（可选，自报）','Research metadata (optional, self-reported)','Forschungsmetadaten (optional, Selbstangabe)'],results:['实验选择分布（仅同意公开汇总的记录）','Experiment choices (opted-in aggregates only)','Versuchsentscheidungen (nur freigegebene Summen)'],changed:['判断改变','Changed judgments','Geänderte Urteile'],votes:['有效标注票','Valid review votes','Gültige Prüfungen'],curated:['虚构编辑语料','Fictional curated samples','Fiktive redaktionelle Belege'],participants:['参与研判账户','Reviewing accounts','Prüfende Konten'],unrated:['尚无研判票的语料','Samples without votes','Belege ohne Stimmen'],anonymous:['匿名汇总','De-identified aggregate','Aggregat ohne Kontokennung'],empty:['暂无数据','No data yet','Noch keine Daten'],initial:['初始判断','Initial judgment','Erstes Urteil'],final:['语境后判断','Judgment with context','Urteil mit Kontext'],count:['记录数','Records','Datensätze']};

const EXP_CONTEXT={friends:[['朋友完成了精心制作的作品，另一位朋友笑着说。','A friend completes a carefully made artwork. Another friend smiles and says this.','Eine Person vollendet ein sorgfältiges Kunstwerk. Eine befreundete Person lächelt und sagt dies.'],['朋友修复了一个很难的程序错误，对方这样回应。','A friend fixes a difficult software bug; another responds this way.','Eine befreundete Person behebt einen schwierigen Programmfehler. So reagiert die andere.'],['朋友解释了迟到原因，另一位这样回应；语调未知。','A friend explains why they are late; the other responds. Tone is unknown.','Eine Person erklärt ihre Verspätung; eine befreundete Person antwortet. Tonfall unbekannt.']],hierarchy:[['下属误删重要文件，上司这样说；互动历史未知。','An employee deletes an important file; their manager says this. Interaction history unknown.','Ein Mitarbeiter löscht eine wichtige Datei; die Führungskraft sagt dies. Vorgeschichte unbekannt.'],['下属解决了团队难题，上司这样说；语调未知。','An employee solves a team problem; the manager says this. Tone unknown.','Eine Person löst ein Teamproblem; die Führungskraft sagt dies. Tonfall unbekannt.'],['上司第三次临时修改任务，下属低声回应。','A manager changes a task at short notice for the third time; an employee responds quietly.','Die Führungskraft ändert zum dritten Mal kurzfristig die Aufgabe; eine unterstellte Person antwortet leise.']],strangers:[['陌生人在公开帖下这样评论，原帖已删除。','A stranger comments under a public post. The original post was deleted.','Eine fremde Person kommentiert einen öffentlichen Beitrag. Der Originalbeitrag ist gelöscht.'],['陌生人看到一个错误计算后这样回复；不知是否熟识。','A stranger replies to an incorrect calculation; prior acquaintance is unknown.','Eine fremde Person antwortet auf eine falsche Rechnung; frühere Bekanntschaft unbekannt.'],['陌生人看到车站停运公告后这样说；无语调信息。','A stranger reads a station closure notice and says this. No tone information.','Eine fremde Person liest eine Bahnhofsschließungsmitteilung und sagt dies. Kein Tonfall bekannt.']]};

function researchRows(r){let rows=samples.filter(s=>r==='review'?s.status==='pending':r==='withdrawn'?s.status==='withdrawn':r==='hashtag'?['approved','pending'].includes(s.status)&&(s.hashtags||[]).includes(activeHashtag()):s.status==='approved'&&(r!=='ambiguous'||s.final_tag==='ambiguous'));if(filter&&!['ambiguous','hashtag'].includes(r))rows=rows.filter(s=>(r==='review'?s.proposed_tag:s.final_tag)===filter);const q=query.trim().toLocaleLowerCase();if(q)rows=rows.filter(s=>[s.text,s.context,s.translation,...s.hashtags||[]].join(' ').toLocaleLowerCase().includes(q));return rows.filter(s=>Object.entries(researchFilters).every(([k,v])=>!v||(k==='dispute'?(s.status!=='pending'||myVotes.some(x=>x.sample_id===s.id))&&(v==='insufficient'?summary(s.id).votes<5:summary(s.id).votes>=5&&(v==='contested'?leading(summary(s.id)).ratio<.8:leading(summary(s.id)).ratio>=.8)):((s.research_meta||{})[k]||'unknown')===v)))}

const baseRender=render;render=function(){baseRender();if(!loaded)return;if(route()==='experiment')renderExperiment();if(route()==='research')renderResearch().catch(catchError);if(route()==='privacy')renderPrivacy().catch(catchError)};
function optionsChoices(){return ['praise','irony','uncertain'].map(k=>`<option value="${k}">${rt(k)}</option>`).join('')}
function renderExperiment(){if(!expDraft)expDraft={item:'toll',relation:'friends',initial:null,reason:'',final:'uncertain',consent:false};const x=expDraft;$('#main').innerHTML=`${title('experiment','protocol')}<section class="panel experiment-panel"><div class="research-filter-grid"><label class="field"><span>DE / EXPRESSION</span><select id="exp-item" ${x.initial?'disabled':''}>${Object.entries(EXP_ITEMS).map(([k,v])=>`<option value="${k}" ${x.item===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label class="field"><span>${rt('relation')}</span><select id="exp-relation" ${x.initial?'disabled':''}>${['friends','hierarchy','strangers'].map(k=>`<option value="${k}" ${x.relation===k?'selected':''}>${rt(k)}</option>`).join('')}</select></label></div><blockquote class="sample-text" lang="de">„${EXP_ITEMS[x.item]}“</blockquote>${!x.initial?`<h2>${rt('baseline')}</h2><form id="exp-first"><label class="field"><select name="initial" required><option value="">—</option>${optionsChoices()}</select></label><button class="primary">${rt('reveal')}</button></form>`:`<p class="badge">${rt('initial')}：${rt(x.initial)}</p><div class="context-box">${esc(rtext(EXP_CONTEXT[x.relation][Object.keys(EXP_ITEMS).indexOf(x.item)]))}</div><h2>${rt('after')}</h2><form id="exp-final"><label class="field"><select name="final">${optionsChoices()}</select></label><label class="field"><span>${rt('reason')}</span><textarea name="reason" required minlength="5" maxlength="1000">${esc(x.reason)}</textarea></label><label class="field inline"><input type="checkbox" name="consent" ${x.consent?'checked':''}>${rt('consent')}</label><button class="primary">${rt('save')}</button></form>`}<p><button id="exp-reset">${rt('reset')}</button></p></section>`;$('#exp-item').onchange=e=>{x.item=e.target.value;renderExperiment()};$('#exp-relation').onchange=e=>{x.relation=e.target.value;renderExperiment()};$('#exp-first')?.addEventListener('submit',e=>{e.preventDefault();x.initial=new FormData(e.target).get('initial');renderExperiment()});$('#exp-reset').onclick=()=>{expDraft=null;renderExperiment()};if(x.initial){$('#exp-final').elements.final.value=x.final;$('#exp-final').oninput=e=>{const fd=new FormData(e.currentTarget);x.final=fd.get('final');x.reason=fd.get('reason');x.consent=fd.has('consent')};$('#exp-final').onsubmit=e=>{e.preventDefault();if(!requireLogin())return;action($('button',e.target),async()=>{const {error}=await db.from('kl_experiments').insert({user_id:user.id,protocol:'context-1.0',item:x.item,relation:x.relation,initial:x.initial,final:x.final,reason:x.reason.trim(),consent:x.consent});if(error)throw error;notify(rt('saved'));expDraft=null;location.hash='privacy'})}}}
async function fetchResearch(){const {data,error}=await db.rpc('kl_research_data');if(error)throw error;researchData=data;return data}
function entropy(ballots){const ns=Object.values(ballots||{}),n=ns.reduce((a,b)=>a+b,0);return n? -ns.reduce((a,b)=>b?a+(b/n)*Math.log2(b/n):a,0):null}
async function renderResearch(){const target=route();$('#main').innerHTML=title('research','overview')+`<p>${t('busy')}</p>`;const data=await fetchResearch();if(route()!==target)return;const reviewed=samples.filter(s=>s.status!=='pending'&&summary(s.id).votes>0),contested=samples.filter(s=>s.status!=='pending'&&summary(s.id).votes>=5&&leading(summary(s.id)).ratio<.8),ex=data.experiments,n=ex.reduce((a,b)=>a+b.n,0),changed=ex.reduce((a,b)=>a+(b.initial!==b.final?b.n:0),0);$('#main').innerHTML=title('research','overview')+`<div class="stats research-stats">${[[samples.filter(s=>s.seed_code).length,'curated'],[samples.filter(s=>!s.seed_code&&s.status==='approved').length,'community'],[stats.samples.reduce((a,b)=>a+b.votes,0),'votes'],[stats.contributors.filter(c=>c.reviews>0).length,'participants'],[contested.length,'contested'],[samples.filter(s=>!summary(s.id).votes).length,'unrated']].map(([n,k])=>`<div class="stat"><strong>${n}</strong><span>${rt(k)}</span></div>`).join('')}</div><section class="panel"><h2>${rt('dispute')}</h2><p class="fine">H = −Σ p log₂ p · 0 = ${rtext(['完全一致；数值越高，标签分布越分散。只显示已入库／下线语料。','Unanimous; higher values mean more dispersed labels. Published/withdrawn samples only.','Einstimmig; höhere Werte bedeuten stärker verteilte Labels. Nur freigegebene/zurückgezogene Belege.'])}</p><div class="research-table"><table><thead><tr><th>${t('sampleText')}</th><th>${rt('votes')}</th><th>${t('lead')}</th><th>H (bits)</th></tr></thead><tbody>${reviewed.sort((a,b)=>entropy(summary(b.id).ballots)-entropy(summary(a.id).ballots)).map(s=>`<tr><td><button data-sample="${s.id}">${esc(s.text)}</button></td><td>${summary(s.id).votes}</td><td>${(leading(summary(s.id)).ratio*100).toFixed(1)}%</td><td>${entropy(summary(s.id).ballots).toFixed(3)}</td></tr>`).join('')||`<tr><td colspan="4">${rt('empty')}</td></tr>`}</tbody></table></div></section><section class="panel"><h2>${rt('results')}</h2><p>${rt('count')}：${n} · ${rt('changed')}：${n?`${changed} / ${n} (${(changed/n*100).toFixed(1)}%)`:'—'}</p><p class="fine">${rt('protocol')}</p><div class="research-table"><table><thead><tr><th>Expression</th><th>${rt('relation')}</th><th>${rt('initial')}</th><th>${rt('final')}</th><th>n</th></tr></thead><tbody>${ex.map(e=>`<tr><td>${esc(EXP_ITEMS[e.item])}</td><td>${rt(e.relation)}</td><td>${rt(e.initial)}</td><td>${rt(e.final)}</td><td>${e.n}</td></tr>`).join('')||`<tr><td colspan="5">${rt('empty')}</td></tr>`}</tbody></table></div></section><section class="panel"><h2>${rt('reasons')}</h2>${data.reasons.map(r=>`<article class="comment"><button data-sample="${r.sample_id}">${esc(samples.find(s=>s.id===r.sample_id)?.text||r.sample_id)}</button><span class="badge">${tag(r.tag)}</span><p>${esc(r.reason)}</p></article>`).join('')||rt('noReasons')}</section>`}
function downloadData(filename,body,type){const u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){let s=typeof v==='object'?JSON.stringify(v):String(v??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
async function exportResearch(r,format){await fetchResearch();const rows=researchRows(r).map(s=>({sample_id:s.id,text:s.text,context:s.context,translation:s.translation,language:s.language,status:s.status,label:s.final_tag||s.proposed_tag,source:s.seed_code?'fictional_curated':'community',metadata:s.research_meta||{},votes:summary(s.id).votes,ballots:s.status==='pending'&&!myVotes.some(v=>v.sample_id===s.id)?{}:summary(s.id).ballots,shared_reasons:researchData.reasons.filter(v=>v.sample_id===s.id).map(v=>({tag:v.tag,reason:v.reason}))}));const fields=['sample_id','text','context','translation','language','status','label','source','metadata','votes','ballots','shared_reasons'];const body=format==='json'?JSON.stringify({protocol:'corpus-export-1.0',exported_at:new Date().toISOString(),filters:{route:r,query,label:filter,...researchFilters},notice:rt('exportNote'),samples:rows},null,2):'\uFEFF'+[fields.map(csvCell).join(','),...rows.map(row=>fields.map(k=>csvCell(row[k])).join(','))].join('\r\n');downloadData(`kontextlab-${new Date().toISOString().slice(0,10)}.${format}`,body,format==='json'?'application/json':'text/csv;charset=utf-8')}
async function renderPrivacy(){$('#main').innerHTML=title('privacy','privacyText')+`<section class="panel"><h2>${rt('erase')}</h2><p>${rt('eraseHelp')}</p></section><section class="panel" id="privacy-controls"><h2>${rt('controls')}</h2>${user?t('busy'):`<button id="privacy-login">${t('login')}</button>`}</section>`;$('#privacy-login')?.addEventListener('click',()=>authDialog('login'));if(!user)return;const uid=user.id;const [a,b]=await Promise.all([db.from('kl_experiments').select('*').eq('user_id',uid).order('created_at',{ascending:false}),db.from('kl_votes').select('sample_id,tag,rationale,research_consent').eq('user_id',uid)]);if(a.error||b.error)throw a.error||b.error;if(route()!=='privacy'||user?.id!==uid)return;$('#privacy-controls').innerHTML=`<h2>${rt('controls')}</h2><button id="download-mine">${rt('downloadMine')}</button><h3>${rt('experiment')}</h3>${a.data.map(e=>`<article class="comment"><b>${EXP_ITEMS[e.item]} · ${rt(e.relation)}</b><p>${rt(e.initial)} → ${rt(e.final)}</p><p>${esc(e.reason)}</p><p class="fine">${e.consent&&!e.withdrawn_at?rt('consent'):rt('privacy')}</p><button data-exp-withdraw="${e.id}">${e.withdrawn_at?rt('restore'):rt('withdraw')}</button> <button data-exp-delete="${e.id}">${rt('deleteRecord')}</button></article>`).join('')||rt('empty')}<h3>${rt('reasons')}</h3>${b.data.map(v=>`<article class="comment"><p>${esc(samples.find(s=>s.id===v.sample_id)?.text||v.sample_id)}</p><p>${esc(v.rationale)}</p><button data-share-reason="${v.sample_id}">${rt(v.research_consent?'unshare':'share')}</button></article>`).join('')||rt('empty')}`;$$('[data-exp-delete]').forEach(btn=>btn.onclick=()=>{const d=openDialog(dialogTop(rt('deleteRecord'))+`<p>${rt('deleteConfirm')}</p><div class="inline"><button id="confirm-exp-delete" class="danger">${rt('deleteRecord')}</button><button id="cancel-exp-delete">${rt('cancel')}</button></div>`);$('#cancel-exp-delete').onclick=()=>d.close();$('#confirm-exp-delete').onclick=e=>action(e.target,async()=>{const {error}=await db.from('kl_experiments').delete().eq('id',btn.dataset.expDelete).eq('user_id',uid);if(error)throw error;d.close();await renderPrivacy()})});$('#download-mine').onclick=()=>downloadData('kontextlab-my-research.json',JSON.stringify({experiments:a.data.map(({user_id,...v})=>v),reviews:b.data},null,2),'application/json');$$('[data-exp-withdraw]').forEach(btn=>btn.onclick=()=>action(btn,async()=>{const e=a.data.find(x=>x.id===btn.dataset.expWithdraw);const {error}=await db.from('kl_experiments').update({withdrawn_at:e.withdrawn_at?null:new Date().toISOString()}).eq('id',e.id).eq('user_id',uid);if(error)throw error;renderPrivacy()}));$$('[data-share-reason]').forEach(btn=>btn.onclick=()=>action(btn,async()=>{const v=b.data.find(x=>x.sample_id===btn.dataset.shareReason);const {error}=await db.from('kl_votes').update({research_consent:!v.research_consent}).eq('sample_id',v.sample_id).eq('user_id',uid);if(error)throw error;renderPrivacy()}))}
const baseSubmit=renderSubmit;renderSubmit=function(){baseSubmit();$('#submission').insertAdjacentHTML('afterbegin',`<fieldset class="panel"><legend>${rt('metadata')}</legend><div class="research-filter-grid">${['relation','phenomenon','scene'].map(k=>selectResearch(k,{relation:['friends','hierarchy','strangers'],phenomenon:['literal','irony','metaphor','quotation'],scene:['work','social','public']}[k])).join('')}</div></fieldset>`);$$('[data-research-filter]',$('#submission')).forEach(s=>{s.name='meta_'+s.dataset.researchFilter;s.options[0].textContent=rt('unknown')})};

const baseOpenSample=openSample;
openSample=async function(id){await baseOpenSample(id);const s=samples.find(x=>x.id===id),d=$('#dialog');if(!s||d.dataset.sampleId!==id)return;d.insertAdjacentHTML('beforeend',`<section class="panel"><h3>${rt('metadata')}</h3><p class="fine">${rt('metadataNote')} ${esc(s.research_meta?.source||'contributor')}</p>${['relation','phenomenon','scene'].map(k=>`<p>${rt(k)}：${esc(rt(s.research_meta?.[k]||'unknown'))}</p>`).join('')}${s.status!=='pending'?`<button id="sample-research-details">${rt('reviewDetails')}</button><div id="sample-research-reasons"></div>`:''}</section>`);$('#sample-research-details',d)?.addEventListener('click',e=>action(e.target,async()=>{await fetchResearch();if(d.dataset.sampleId!==id)return;const rows=researchData.reasons.filter(x=>x.sample_id===id);$('#sample-research-reasons',d).innerHTML=voteDistribution(summary(id))+(rows.map(r=>`<article class="comment"><span class="badge">${tag(r.tag)}</span><p>${esc(r.reason)}</p></article>`).join('')||`<p>${rt('noReasons')}</p>`)}))};
init();
</script></body></html>
